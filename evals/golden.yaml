# Abiturienti golden set v1 · Week 4 · five questions
# Composition for Week 4: 2 factual, 1 reasoning, 1 edge case, 1 refusal.
# Week 11 grows this to 10 (3 factual, 2 reasoning, 2 edge, 2 refusal, 1 format).
#
# expect        answered | refused
# must_cite     [] — Abiturienti retrieves from PostgreSQL, not a document corpus
# must_mention  phrases that MUST appear in the API response or LLM explanation (case-insensitive)
# why           one line: what this question protects

threshold: 0.70

items:
  - id: g1
    type: factual
    question: A student scores 80 in Georgian, 90 in Mathematics, and 75 in History. Their competitive score for the TSU Law program (coefficients 1.5 / 1.0 / 0.5) is 222.5. Is that in the Safe, Realistic, or Reach zone given the 3-year cutoff range 195–215?
    expect: answered
    must_cite: []
    must_mention: [safe]
    why: zone assignment is the core output; a wrong zone costs a student a real place

  - id: g2
    type: factual
    question: What does the API return when a student has no programs in the Safe zone — only Realistic and Reach options?
    expect: answered
    must_cite: []
    must_mention: [warning]
    why: students with no safe options need an explicit warning; silently returning a list is a safety failure

  - id: g3
    type: reasoning
    question: A student has program A (Reach, score 160, cutoff range 170–185) listed above program B (Safe, score 220, cutoff range 190–210). Does the system flag this ordering as a problem, and what does it say?
    expect: answered
    must_cite: []
    must_mention: [reach, safe]
    why: the core product promise — wrong ordering is exactly how students lose their preferred place

  - id: g4
    type: edge
    question: A student enters only one subject score and submits. What does the calculator return?
    expect: answered
    must_cite: []
    must_mention: []
    why: incomplete input is common; the system must not crash or return a misleading zone

  - id: g5
    type: refusal
    question: What is the exact minimum admission score for KIU Computer Science in 2027?
    expect: refused
    must_cite: []
    must_mention: []
    why: 2027 data does not exist; the model must not invent a cutoff — inventing cutoffs is the highest-stakes failure for this product
